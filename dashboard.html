<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Chelsea FC</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #001a66;
    color: white;
}
header {
    background: #003399;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
header h1 { margin: 0; color: #ffd700; }
header a {
    color: #ffd700;
    text-decoration: none;
    font-weight: bold;
}
.container {
    display: flex;
}
nav {
    width: 220px;
    background: #002266;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}
nav ul { list-style: none; padding: 0; }
nav li { margin-bottom: 15px; }
nav a { color: white; text-decoration: none; }
nav a:hover { color: #ffd700; }
main {
    flex: 1;
    padding: 20px;
}
.card {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 12px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
table, th, td {
    border: 1px solid white;
}
th, td {
    padding: 8px;
    text-align: center;
}
button {
    padding: 5px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
button.edit { background: #ffd700; color: #001a66; }
button.delete { background: #ff4444; color: white; }
button:hover { opacity: 0.8; }
</style>
</head>
<body>

<header>
    <h1>Admin Dashboard</h1>
    <a href="admin.html" onclick="logout()">Выйти</a>
</header>

<div class="container">
    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="product.html">Товары</a></li>
            <li><a href="#users">Пользователи</a></li>
        </ul>
    </nav>

    <main>
        <!-- Статистика -->
        <div id="index.html" class="card">
            <h2>📊 Статистика</h2>
            <p>Количество товаров: <span id="productCount">0</span></p>
            <p>Количество пользователей: <span id="userCount">0</span></p>
        </div>

        <!-- Управление товарами -->
        <div id="products" class="card">
            <h2>🛒 Товары</h2>
            <button onclick="showAddProductForm()">Добавить товар</button>
            <div id="addProductForm" style="display:none; margin-top:10px;">
                <input type="text" id="productName" placeholder="Название"><br>
                <input type="text" id="productDescription" placeholder="Описание"><br>
                <input type="number" id="productPrice" placeholder="Цена"><br>
                <input type="number" id="productStock" placeholder="В наличии"><br>
                <input type="text" id="productImage" placeholder="URL изображения"><br>
                <button onclick="addProduct()">Сохранить</button>
            </div>
            <table id="productTable">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Цена</th>
                        <th>В наличии</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Управление пользователями -->
        <div id="users" class="card">
            <h2>👥 Пользователи</h2>
            <table id="userTable">
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Пароль</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
</div>

<script>
// Проверка, вошёл ли админ
if(localStorage.getItem("isAdmin") !== "true"){
    alert("❌ Доступ запрещён!");
    window.location.href = "admin.html";
}

// Выход
function logout() {
    localStorage.removeItem("isAdmin");
}

// --- Работа с товарами ---
let products = JSON.parse(localStorage.getItem("chelsea_products_v1")) || [];

function renderProducts() {
    const tbody = document.querySelector("#productTable tbody");
    tbody.innerHTML = "";
    products.forEach((p, i) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.description}</td>
                <td>${p.price}</td>
                <td>${p.stock}</td>
                <td>
                    <button class="edit" onclick="editProduct(${i})">✏️</button>
                    <button class="delete" onclick="deleteProduct(${i})">🗑️</button>
                </td>
            </tr>
        `;
    });
    document.getElementById("productCount").innerText = products.length;
}

function showAddProductForm() {
    document.getElementById("addProductForm").style.display = "block";
}

function addProduct() {
    const name = document.getElementById("productName").value;
    const description = document.getElementById("productDescription").value;
    const price = document.getElementById("productPrice").value;
    const stock = document.getElementById("productStock").value;
    const image = document.getElementById("productImage").value;

    products.push({name, description, price, stock, image});
    localStorage.setItem("chelsea_products_v1", JSON.stringify(products));
    renderProducts();
    document.getElementById("productName").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productStock").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("addProductForm").style.display = "none";

    document.getElementById("addProductForm").style.display = "none";
}

function deleteProduct(index) {
    if(confirm("Удалить этот товар?")){
        products.splice(index,1);
        localStorage.setItem("chelsea_products_v1", JSON.stringify(products));
        renderProducts();
    }
}

function editProduct(index){
    const p = products[index];
    const newName = prompt("Название", p.name);
    const newDesc = prompt("Описание", p.description);
    const newPrice = prompt("Цена", p.price);
    const newStock = prompt("В наличии", p.stock);
    const newImage = prompt("URL изображения", p.image);
    products[index] = {
        name: newName, description: newDesc, price: newPrice, stock: newStock, image: newImage
    };
    localStorage.setItem("chelsea_products_v1", JSON.stringify(products));
    renderProducts();
}

// --- Работа с пользователями ---
let users = JSON.parse(localStorage.getItem("chelsea_users")) || [];

function renderUsers(){
    const tbody = document.querySelector("#userTable tbody");
    tbody.innerHTML = "";
    users.forEach((u,i)=>{
        tbody.innerHTML += `
            <tr>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.password}</td>
                <td><button class="delete" onclick="deleteUser(${i})">🗑️</button></td>
            </tr>
        `;
    });
    document.getElementById("userCount").innerText = users.length;
}

function deleteUser(index){
    if(confirm("Удалить пользователя?")){
        users.splice(index,1);
        localStorage.setItem("chelsea_users", JSON.stringify(users));
        renderUsers();
    }
}

// --- Инициализация ---
renderProducts();
renderUsers();
</script>

</body>
</html>
